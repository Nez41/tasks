<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="タスク">
  <title>タスク</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>タスク</h1>
    <button id="openGenres" class="icon-btn" aria-label="ジャンル設定">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg>
    </button>
  </header>

  <main>
    <section class="picks">
      <h2>★ 今やるならこれ</h2>
      <ol id="picks"></ol>
      <p id="picksEmpty" class="empty" hidden>タスクを追加すると、ここにおすすめが出ます</p>
    </section>

    <section>
      <h2>すべてのタスク <span id="count" class="count"></span></h2>
      <ul id="list" class="list"></ul>
    </section>

    <section id="doneSection" hidden>
      <details>
        <summary>完了したタスク <span id="doneCount" class="count"></span></summary>
        <ul id="doneList" class="list done"></ul>
      </details>
    </section>
  </main>

  <button id="addBtn" class="fab" aria-label="タスクを追加">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- タスク追加・編集 -->
  <div id="taskSheet" class="sheet-wrap" hidden>
    <div class="backdrop" data-close></div>
    <form id="taskForm" class="sheet" autocomplete="off">
      <input id="title" class="title-input" type="text" placeholder="やりたいこと" enterkeyhint="done">

      <div class="field">
        <span class="label">重要度</span>
        <div class="seg" id="importance">
          <button type="button" data-v="3">高</button>
          <button type="button" data-v="2">中</button>
          <button type="button" data-v="1">低</button>
        </div>
      </div>

      <div class="field">
        <span class="label">期限</span>
        <div class="chips" id="due">
          <button type="button" data-v="today">今日</button>
          <button type="button" data-v="week">今週</button>
          <button type="button" data-v="month">今月</button>
          <button type="button" data-v="none">なし</button>
          <label class="chip-date">
            <span id="dueDateLabel">日付</span>
            <input id="dueDate" type="date">
          </label>
        </div>
      </div>

      <div class="field">
        <span class="label">ジャンル</span>
        <div class="chips" id="genre"></div>
      </div>

      <div class="sheet-actions">
        <button type="button" id="deleteTask" class="danger" hidden>削除</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>

  <!-- ジャンル設定 -->
  <div id="genreSheet" class="sheet-wrap" hidden>
    <div class="backdrop" data-close></div>
    <div class="sheet">
      <h2 class="sheet-title">ジャンル</h2>
      <ul id="genreList" class="genre-list"></ul>
      <form id="genreForm" class="genre-add" autocomplete="off">
        <input id="genreName" type="text" placeholder="新しいジャンル" enterkeyhint="done">
        <button type="submit" class="primary">追加</button>
      </form>
      <div class="sheet-actions">
        <button type="button" data-close>閉じる</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden>
    <span id="toastText"></span>
    <button id="toastUndo">取り消す</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
